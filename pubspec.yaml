# ══════════════════════════════════════════════════════════════════
#  SU-35 Notes — تطبيق ملاحظات الطيران (Flutter + Supabase)
#  المرحلة (أ): المصادقة + الدفاتر + الصفحات
#  المرحلة (ب): المحرر الغني (flutter_quill) + الكتل + المرفقات + تصدير PDF
#  الإصدارات أدناه مُتحقَّق منها مقابل أحدث نسخ مستقرة على pub.dev
#  (Flutter 3.47.x / Dart 3.13.x وقت كتابة المشروع).
# ══════════════════════════════════════════════════════════════════
name: su35_notes
description: "مساحة عمل ملاحظات متخصصة للطيارين والمهندسين: دفاتر، صفحات، قوالب، وسوم، وبحث نصي كامل."
publish_to: "none"
version: 1.0.0+1

environment:
  # Dart 3.12 يأتي مع Flutter 3.44 (وأحدث نسخة مستقرة Flutter 3.47.7 / Dart 3.13.5)
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # الترجمات + دعم RTL (يجب أن تكون من الـ SDK)
  flutter_localizations:
    sdk: flutter

  # ── المكدس الأساسي ────────────────────────────────────────────
  flutter_riverpod: ^3.4.0      # إدارة الحالة (Riverpod 3)
  go_router: ^18.0.0            # التوجيه التصريحي (Deep links)
  supabase_flutter: ^2.18.2     # Auth + Postgres + Storage + Realtime

  # ── إعدادات وبيانات محلية ─────────────────────────────────────
  flutter_dotenv: ^6.0.1        # قراءة مفاتيح Supabase من .env
  shared_preferences: ^2.3.0    # تخزين الوضع الليلي واللغة محليًا

  # ── المحرر الغني والمرفقات وتصدير PDF (المرحلة ب) ──────────────
  flutter_quill: ^11.6.0       # محرر نص غني (Delta) — يدعم العربية و RTL
  pdf: ^3.13.1                 # توليد ملفات PDF برمجيًا
  printing: ^5.15.1            # مشاركة/طباعة PDF + تحميل الخطوط العربية
  image_picker: ^1.2.4         # اختيار/التقاط صور المرفقات
  file_selector: ^1.1.0        # اختيار ملفات PDF من الجهاز
  url_launcher: ^6.3.3         # فتح المرفقات في تطبيق خارجي
  uuid: ^4.6.0                 # تسمية مسارات المرفقات بشكل فريد

  # ── واجهة ────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # تفعيل توليد الترجمات من lib/l10n/arb حسب l10n.yaml
  generate: true

  assets:
    # ملف الأسرار/الإعدادات — يجب إنشاؤه قبل التشغيل (انسخ .env.example)
    - .env

    # خطوط تصدير PDF (اختيارية): ضع Cairo-Regular.ttf و Cairo-Bold.ttf هنا.
    # إن لم تكونا موجودتين يُنزّلها التطبيق تلقائيًا من Google Fonts عند التصدير.
    - assets/fonts/
